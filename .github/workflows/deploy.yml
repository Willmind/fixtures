name: 检查并部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - run: bash -n deploy/setup-server.sh deploy/publish.sh
      - run: npm run build

  publish:
    name: 发布网站产物
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 发布到专用产物分支
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/publish.sh
      - name: 等待服务器更新并验证线上版本
        if: vars.DEPLOY_ENABLED == 'true' && steps.publish.outputs.published == 'true'
        run: |
          for _attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 10 \
              "https://home.willmindgg.cn/deployment.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              -o "$RUNNER_TEMP/live-deployment.json" && \
              python3 -c 'import json,sys; expected=json.load(open("dist/deployment.json")); actual=json.load(open(sys.argv[1])); sys.exit(0 if actual == expected else 1)' \
              "$RUNNER_TEMP/live-deployment.json"; then
              echo '已验证线上版本：https://home.willmindgg.cn/' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '服务器尚未更新，请检查 fixtures-home-deploy.service 的日志。' >&2
          exit 1
